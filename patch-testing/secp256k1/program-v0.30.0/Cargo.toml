[workspace]
[package]
name = "secp256k1_program_v0-30-0"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "secp256k1_verify_v0-30-0"
path = "bin/verify.rs"

[[bin]]
name = "secp256k1_recover_v0-30-0"
path = "bin/recover.rs"


[dependencies]
sp1-zkvm = {  path = "../../../crates/zkvm/entrypoint" }
# serde = { version = "1.0.215", features = ["derive"] }
secp256k1 = { git = "https://github.com/sp1-patches/rust-secp256k1", rev = "046080d207a4064773cdfa609856f26f92a7ca81", package = "secp256k1", features = [
    "recovery",
    "global-context",
    "serde",
] }

[patch.crates-io]
sp1-lib = { path = "../../../crates/zkvm/lib" }
