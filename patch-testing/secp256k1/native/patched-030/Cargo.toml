[workspace]

[package]
name = "secp-native-patched-030"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "secp-native-patched-030"
path = "../main.rs"

[features]
default = ["v030"]
v030 = []

[dependencies]
secp256k1 = { version = "=0.30.0", git = "https://github.com/sp1-patches/rust-secp256k1", tag = "patch-0.30.0-sp1-6.10.0-r1", features = ["recovery"] }
bincode = "1.3"

[patch.crates-io]
sp1-lib = { path = "../../../../crates/zkvm/lib" }
