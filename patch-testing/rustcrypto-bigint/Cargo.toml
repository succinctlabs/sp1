[package]
name = "rustcrypto-bigint"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
sp1-zkvm = { workspace = true }
sp1-sdk = { workspace = true, default-features = true }
sp1-core-executor = { workspace = true }
rand = { workspace = true }
sp1-test = { workspace = true }
tokio = { workspace = true }
color-eyre = { workspace = true }
crypto-bigint = { workspace = true, features = ["alloc"] }
crypto-bigint-patched = { git = "https://github.com/sp1-patches/RustCrypto-bigint", rev = "802362f306944944b5b251570e3c62c745f92c71", package = "crypto-bigint", features = ["alloc"] }

num-bigint = "0.4"

[features]
prove = []
gpu = ["sp1-sdk/cuda"]

[build-dependencies]
sp1-build = { workspace = true }
