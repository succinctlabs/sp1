[workspace]
[package]
name = "RustCrypto-bigint-test"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bigint_test_mul_mod_special"
path = "bin/mul_mod_special.rs"

[[bin]]
name = "bigint_test_mul_add_residue"
path = "bin/mul_add_residue.rs"

[[bin]]
name = "bigint_test_mul_mod_special_edges"
path = "bin/mul_mod_special_edges.rs"

[[bin]]
name = "bigint_test_residue_identity"
path = "bin/residue_identity.rs"

[dependencies]
sp1-zkvm = {  path = "../../../crates/zkvm/entrypoint" }
sp1-lib = { path = "../../../crates/zkvm/lib" }
num-bigint = "0.4.0"
crypto-bigint = { version = "0.5.5", features = ["alloc"] }

[patch.crates-io]
crypto-bigint = { git = "https://github.com/sp1-patches/RustCrypto-bigint", rev = "802362f306944944b5b251570e3c62c745f92c71" }
