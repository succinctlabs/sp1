[workspace]
[package]
name = "k256_patch_test"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "k256_verify"
path = "bin/verify.rs"

[[bin]]
name = "k256_recover"
path = "bin/recover.rs"

[[bin]]
name = "k256_schnorr_verify"
path = "bin/schnorr_verify.rs"

[[bin]]
name = "k256_point_ops"
path = "bin/point_ops.rs"

[[bin]]
name = "k256_field_checks"
path = "bin/field_checks.rs"

[dependencies]
sp1-zkvm = { path = "../../../crates/zkvm/entrypoint" }
k256 = { version = "0.13.4", default-features = false, features = [
    "ecdsa",
    "serde",
    "alloc",
    "schnorr",
    "pkcs8",
    "expose-field",
] }
ecdsa-core = { version = "0.16.9", package = "ecdsa", features = ["verifying"] }

[patch.crates-io]
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", rev = "410395fa85708c98411b616de0dbfb5d915cccfb" }
sp1-lib = { path = "../../../crates/zkvm/lib" }
