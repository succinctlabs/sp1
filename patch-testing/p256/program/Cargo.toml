[workspace]
[package]
name = "p256_patch_test"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "p256_verify"
path = "bin/verify.rs"

[[bin]]
name = "p256_recover"
path = "bin/recover.rs"

[[bin]]
name = "p256_field_checks"
path = "bin/field_checks.rs"

[[bin]]
name = "p256_point_checks"
path = "bin/point_checks.rs"

[dependencies]
sp1-zkvm = { path = "../../../crates/zkvm/entrypoint" }
p256 = { version = "0.13.2", default-features = false, features = [
    "ecdsa",
    "alloc",
    "serde",
    "expose-field",
] }
ecdsa-core = { version = "0.16.9", package = "ecdsa", features = ["verifying"] }

[patch.crates-io]
p256 = { git = "https://github.com/sp1-patches/elliptic-curves", rev = "3cead317587c0c7201648aa22c69abace409a91c" }
sp1-lib = { path = "../../../crates/zkvm/lib" }
