[workspace]
[package]
name = "bls12_381_test_program"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bls12_381_fp_test_inverse"
path = "bin/test_inverse.rs"

[[bin]]
name = "bls12_381_fp_test_sqrt"
path = "bin/test_sqrt.rs"

[[bin]]
name = "bls12_381_fp2_test_inverse"
path = "bin/test_inverse_fp2.rs"

[[bin]]
name = "bls12_381_fp2_test_sqrt"
path = "bin/test_sqrt_fp2.rs"

[[bin]]
name = "bls12_381_ec_add_test"
path = "bin/test_bls_add.rs"

[[bin]]
name = "bls12_381_ec_double_test"
path = "bin/test_bls_double.rs"

[[bin]]
name = "bls12_381_field_checks"
path = "bin/field_checks.rs"

[[bin]]
name = "bls12_381_point_checks"
path = "bin/point_checks.rs"

[[bin]]
name = "bls12_381_v2_field_checks"
path = "bin/v2_field_checks.rs"

[[bin]]
name = "bls12_381_v2_point_checks"
path = "bin/v2_point_checks.rs"

# todo explicit mul and add tests

[dependencies]
sp1-lib = { path = "../../../crates/zkvm/lib" }
sp1-zkvm = { path = "../../../crates/zkvm/entrypoint" }
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.10.0", features = [
    "groups",
] }
bls12_381_v2 = { package = "bls12_381", git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.10.0-v2", features = ["groups", "experimental"] }
sha2 = "0.9.9"

[patch.crates-io]
sp1-lib = { path = "../../../crates/zkvm/lib" }
