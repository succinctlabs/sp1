name: Runner smoke

on:
  workflow_dispatch:
    inputs:
      runs_on_environment:
        description: RunsOn environment to compare with the default installation
        type: string
        required: true

permissions: {}

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        environment: [production, "${{ inputs.runs_on_environment }}"]
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/family=c7i.large/image=ubuntu22-full-x64/env=${{ matrix.environment }}/spot=false
    timeout-minutes: 5
    steps:
      - name: Verify runner execution
        run: |
          test "$(uname -m)" = x86_64
          printf 'Runner smoke check passed\n'
