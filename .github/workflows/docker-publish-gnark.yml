# This workflow publishes the docker image for groth16 and plonk proving to ghcr.io.
name: Docker Publish Gnark

on:
  workflow_dispatch:
    inputs:
      docker-tag:
        description: "Docker tag to push"
        type: string
        required: true
      dry-run:
        description: "Dry run - does not push the image"
        type: boolean
        default: false
  workflow_call:
    inputs:
      docker-tag:
        description: "Docker tag to push"
        type: string
        required: true
      dry-run:
        description: "Dry run - does not push the image"
        type: boolean
        default: false

jobs:
  docker-publish-gnark:
    name: docker-publish-gnark-${{ matrix.arch }}
    runs-on: [runs-on, "runner=${{ matrix.runner }}", spot=false, "run-id=${{ github.run_id }}"]
    permissions:
      id-token: write
      packages: write
      contents: read

    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: 64cpu-linux-x64
          - arch: arm64
            platform: linux/arm64
            runner: 64cpu-linux-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.gnark-ffi
          platforms: ${{ matrix.platform }}
          push: ${{ inputs.dry-run != true }}
          tags: ghcr.io/succinctlabs/sp1-gnark:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-manifest:
    name: create-multi-platform-manifest
    if: ${{ inputs.dry-run != true }}
    needs: [docker-publish-gnark]
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and verify multi-platform image
        env:
          IMAGE: ghcr.io/succinctlabs/sp1-gnark:${{ inputs.docker-tag }}
          AMD64_IMAGE: ghcr.io/succinctlabs/sp1-gnark:${{ github.sha }}-amd64
          ARM64_IMAGE: ghcr.io/succinctlabs/sp1-gnark:${{ github.sha }}-arm64
        run: |
          docker buildx imagetools create --tag "$IMAGE" "$AMD64_IMAGE" "$ARM64_IMAGE"
          docker buildx imagetools inspect "$IMAGE" --raw | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture]
            | unique == ["amd64", "arm64"]
          '
