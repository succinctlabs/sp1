# This workflow generates and tests the docker image for groth16 and plonk proving. 

name: Docker Gnark

on:
  push:
    branches: [main, dev, multilinear_v6]
  # TODO: Enable once recursion crates are fixed for multilinear.
  pull_request:
    branches:
      - "**"
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Dockerfile.gnark-ffi"
      - ".github/workflows/**"
  merge_group:

jobs:
  test-docker:
    name: Test
    runs-on:
      [
        runs-on,
        runner=64cpu-linux-arm64,
        disk=large,
        spot=false,
        "run-id=${{ github.run_id }}",
      ]
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup CI
        uses: ./.github/actions/setup
        with:
          pull_token: ${{ github.token }}

      - name: Build docker image
        run: |
          docker build -t sp1-gnark -f ./Dockerfile.gnark-ffi .

      - name: Install SP1 toolchain
        run: |
          cargo run -p sp1-cli --no-default-features -- prove install-toolchain
          
      - name: Run cargo test
        env:
          SP1_GNARK_IMAGE: sp1-gnark
          RUST_LOG: info
          RUSTFLAGS: -Copt-level=3 -Cdebug-assertions -Coverflow-checks=y -Cdebuginfo=0
          RUST_BACKTRACE: 1   
        run: |
          test_name=worker::node::full::tests::test_e2e_groth16_node
          test_list=$(cargo test --release -p sp1-prover --features experimental -- --list --ignored --exact "$test_name")
          printf '%s\n' "$test_list"
          grep -Fxq "$test_name: test" <<< "$test_list"
          cargo test --release -p sp1-prover --features experimental -- --exact "$test_name" --ignored --nocapture

      - name: Make sure the contracts were modified
        run: |
          if grep -q "pragma solidity ^0.8.0" ~/.sp1/circuits/dev/Groth16Verifier.sol; then
            echo "Error: Groth16Verifier.sol still contains the old pragma version"
            exit 1
          fi
          if grep -q "pragma solidity ^0.8.0" ~/.sp1/circuits/dev/PlonkVerifier.sol; then
            echo "Error: PlonkVerifier.sol still contains the old pragma version"
            exit 1
          fi
