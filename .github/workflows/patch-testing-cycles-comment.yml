name: Patch Testing Cycles Comment

on:
  workflow_run:
    workflows: ["Patch Testing Cycles"]
    types: [completed]

jobs:
  check-artifact:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      exists: ${{ steps.artifact.outputs.exists }}
    steps:
      - name: Check for cycle stats
        id: artifact
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.payload.workflow_run.id,
              },
            );
            core.setOutput(
              "exists",
              artifacts.some((artifact) => artifact.name === "patch-testing-results"),
            );

  post-comment:
    needs: check-artifact
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && needs.check-artifact.outputs.exists == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: "Checkout sources"
        uses: "actions/checkout@v6"

      - name: Setup CI
        uses: ./.github/actions/setup
        with:
          pull_token: ${{ secrets.PRIVATE_PULL_TOKEN }}

      - name: "Download cycle stats"
        uses: actions/download-artifact@v4
        with:
          name: patch-testing-results
          path: patch-testing
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Get PR number"
        id: pr
        run: |
          # Get the PR number from the workflow run
          PR_NUMBER=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }} --jq '.pull_requests[0].number')
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Post comment to PR"
        run: |
          cd ./patch-testing
          RUST_BACKTRACE=full cargo run --bin post-to-github
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_CYCLE_STATS: ${{ github.workspace }}/patch-testing/old_cycle_stats.json
          NEW_CYCLE_STATS: ${{ github.workspace }}/patch-testing/new_cycle_stats.json
